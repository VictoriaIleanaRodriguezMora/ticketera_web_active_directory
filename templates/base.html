<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticketera de soporte</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="{% url 'ticket_list' %}">🎫 Ticketera</a>
{% if user.is_authenticated %}<div class="d-flex align-items-center gap-3 text-white"><span>{{ user.username }}</span><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Salir</button></form></div>{% endif %}
</div></nav><main class="container py-4">{% block content %}{% endblock %}</main></body></html>
